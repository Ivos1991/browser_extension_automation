[project]
name = "browser-automation-sentinel-one"
version = "0.1.0"
description = "Production-style Pytest + Playwright framework for browser extension validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.13.5",
    "assertpy>=1.1",
    "pillow>=11.0.0",
    "playwright>=1.53.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["actions*", "config*", "constants*", "core*", "fixtures*", "pages*", "tests*"]
