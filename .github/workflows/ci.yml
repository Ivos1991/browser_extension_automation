name: PR Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      marker_selection:
        description: "Marker group to run"
        required: true
        default: "all_markers"
        type: choice
        options:
          - all_markers
          - positive
          - negative
          - visual
          - custom
      custom_marker:
        description: "Custom pytest marker expression (used only when marker_selection=custom)"
        required: false
        default: ""
        type: string
      evidence_mode:
        description: "Playwright evidence collection mode"
        required: true
        default: "failure_only"
        type: choice
        options:
          - failure_only
          - full
          - screenshot_only
      parallel_run:
        description: "Enable pytest-xdist parallel execution"
        required: true
        default: "off"
        type: choice
        options:
          - off
          - on
      worker_count:
        description: "Number of pytest-xdist workers when parallel_run=on"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"

permissions:
  contents: write

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_allure_results: ${{ steps.detect_allure_results.outputs.has_results }}
    env:
      HEADLESS: "true"
      BROWSER_EVIDENCE_MODE: ${{ inputs.evidence_mode || vars.BROWSER_EVIDENCE_MODE || 'failure_only' }}
      MARKER_SELECTION: ${{ inputs.marker_selection || 'all_markers' }}
      CUSTOM_MARKER: ${{ inputs.custom_marker || '' }}
      PARALLEL_RUN: ${{ inputs.parallel_run || 'off' }}
      WORKER_COUNT: ${{ inputs.worker_count || '2' }}
      ARTIFACT_DIR: artifacts
      TARGET_ENV: ci
      EXTENSION_PATH: extensions/prompt-security
      EXTENSION_API_KEY: ${{ secrets.EXTENSION_API_KEY || '13793400-107d-406b-b9ed-5cd7bb22be98' }}
      EXTENSION_API_DOMAIN: ${{ vars.EXTENSION_API_DOMAIN || 'eu.prompt.security' }}
      PROMPT_SECURITY_EXTENSION_ZIP_BASE64: ${{ secrets.PROMPT_SECURITY_EXTENSION_ZIP_BASE64 }}
      ALLOWED_URL: https://chatgpt.com
      BLOCKED_URL: https://gemini.google.com
      POLICY_SYNC_TIMEOUT_MS: "90000"
      POLICY_SYNC_POLL_INTERVAL_MS: "2000"
      VISUAL_MAX_DIFF_PIXELS: "15000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Materialize unpacked extension from secret
        if: ${{ env.PROMPT_SECURITY_EXTENSION_ZIP_BASE64 != '' }}
        shell: bash
        run: |
          mkdir -p "${EXTENSION_PATH}"
          echo "${PROMPT_SECURITY_EXTENSION_ZIP_BASE64}" | base64 --decode > extension.zip
          unzip -q extension.zip -d "${EXTENSION_PATH}"

      - name: Validate extension directory
        shell: bash
        run: |
          if [ ! -f "${EXTENSION_PATH}/manifest.json" ]; then
            echo "Missing unpacked extension at ${EXTENSION_PATH}. Commit it to the repo or provide PROMPT_SECURITY_EXTENSION_ZIP_BASE64." >&2
            exit 1
          fi

      - name: Run pytest
        shell: bash
        run: |
          marker_expression="ui"
          xdist_args=""
          case "${MARKER_SELECTION}" in
            positive)
              marker_expression="ui and positive"
              ;;
            negative)
              marker_expression="ui and negative"
              ;;
            visual)
              marker_expression="ui and visual"
              ;;
            custom)
              if [ -z "${CUSTOM_MARKER}" ]; then
                echo "custom_marker is required when marker_selection=custom" >&2
                exit 1
              fi
              marker_expression="${CUSTOM_MARKER}"
              ;;
            *)
              marker_expression="ui"
              ;;
          esac
          if [ "${PARALLEL_RUN}" = "on" ]; then
            xdist_args="-n ${WORKER_COUNT}"
          fi
          echo "Running pytest marker expression: ${marker_expression}"
          echo "Parallel mode: ${PARALLEL_RUN}"
          echo "Worker count: ${WORKER_COUNT}"
          python -m pytest tests/ui -m "${marker_expression}" ${xdist_args} -q -rs --basetemp artifacts/pytest-tmp --alluredir artifacts/allure-results

      - name: Detect Allure results
        if: always()
        id: detect_allure_results
        shell: bash
        run: |
          if [ -d artifacts/allure-results ] && [ "$(find artifacts/allure-results -type f | head -n 1)" ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Allure CLI
        if: always() && steps.detect_allure_results.outputs.has_results == 'true'
        run: npm install -g allure-commandline

      - name: Generate Allure HTML report
        if: always() && steps.detect_allure_results.outputs.has_results == 'true'
        run: allure generate artifacts/allure-results --clean --single-file -o artifacts/allure-report

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          if-no-files-found: warn
          path: artifacts/allure-results/

      - name: Upload allure HTML report
        if: always() && steps.detect_allure_results.outputs.has_results == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          if-no-files-found: warn
          path: artifacts/allure-report/

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          if-no-files-found: warn
          path: artifacts/

  publish-summary-no-report:
    if: always() && needs.pr-checks.outputs.has_allure_results != 'true'
    needs: pr-checks
    runs-on: ubuntu-latest
    steps:
      - name: Publish CI summary
        run: |
          {
            echo "## CI Report Summary"
            echo
            echo "- Marker selection: \`${{ github.event.inputs.marker_selection || 'all_markers' }}\`"
            echo "- Custom marker: \`${{ github.event.inputs.custom_marker || 'n/a' }}\`"
            echo "- Evidence mode: \`${{ github.event.inputs.evidence_mode || vars.BROWSER_EVIDENCE_MODE || 'failure_only' }}\`"
            echo "- Parallel run: \`${{ github.event.inputs.parallel_run || 'off' }}\`"
            echo "- Worker count: \`${{ github.event.inputs.worker_count || '2' }}\`"
            echo "- No Allure HTML report was generated in this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-report:
    if: always() && needs.pr-checks.outputs.has_allure_results == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: pr-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-html-report
          path: artifacts/allure-report

      - name: Publish report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: artifacts/allure-report
          force_orphan: true

      - name: Publish CI summary
        run: |
          {
            echo "## CI Report Summary"
            echo
            echo "- Marker selection: \`${{ github.event.inputs.marker_selection || 'all_markers' }}\`"
            echo "- Custom marker: \`${{ github.event.inputs.custom_marker || 'n/a' }}\`"
            echo "- Evidence mode: \`${{ github.event.inputs.evidence_mode || vars.BROWSER_EVIDENCE_MODE || 'failure_only' }}\`"
            echo "- Parallel run: \`${{ github.event.inputs.parallel_run || 'off' }}\`"
            echo "- Worker count: \`${{ github.event.inputs.worker_count || '2' }}\`"
            echo "- Click [here](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) to open the Allure report."
            echo "- Workflow artifact backup: [allure-html-report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-summary-artifact-only:
    if: always() && needs.pr-checks.outputs.has_allure_results == 'true' && !(github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: pr-checks
    runs-on: ubuntu-latest
    steps:
      - name: Publish CI summary
        run: |
          {
            echo "## CI Report Summary"
            echo
            echo "- Marker selection: \`${{ github.event.inputs.marker_selection || 'all_markers' }}\`"
            echo "- Custom marker: \`${{ github.event.inputs.custom_marker || 'n/a' }}\`"
            echo "- Evidence mode: \`${{ github.event.inputs.evidence_mode || vars.BROWSER_EVIDENCE_MODE || 'failure_only' }}\`"
            echo "- Parallel run: \`${{ github.event.inputs.parallel_run || 'off' }}\`"
            echo "- Worker count: \`${{ github.event.inputs.worker_count || '2' }}\`"
            echo "- Click [here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts) to open the workflow artifacts page."
            echo "- GitHub Pages deployment is skipped for pull request and non-main push runs."
          } >> "$GITHUB_STEP_SUMMARY"
