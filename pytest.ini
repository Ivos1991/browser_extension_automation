[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    ui: Browser-extension UI validation tests.
    smoke: Critical validation coverage for extension policy behavior.
    blocked: Access-blocking validation scenarios.
    allowed: Access-allow validation scenarios.
    visual: Visual regression and screenshot-comparison tests.
    collect_all_evidence: Always attach the configured evidence set for this test.
