[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    ui: Browser-extension UI validation tests.
    positive: Positive and enforcement-resilience browser-extension scenarios.
    negative: Negative misconfiguration and failure-mode browser-extension scenarios.
    visual: Visual regression and screenshot-comparison tests.
    collect_all_evidence: Always attach the configured evidence set for this test.
